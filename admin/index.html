<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrace termínů — Michaela Sedláčková</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/images/logo/Ikona favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

<header class="admin-header">
  <div class="admin-header-brand">
    <img src="/images/logo/Ikona favicon.svg" alt="" class="admin-header-logo">
    <div>
      <h1>Administrace kurzu</h1>
      <p class="admin-header-sub">Michaela Sedláčková</p>
    </div>
  </div>
  <button id="logout-btn" class="btn btn-ghost" hidden>Odhlásit se</button>
</header>

<main class="admin-main">

  <!-- Přihlášení -->
  <section id="login-view" class="admin-card admin-card-narrow">
    <h2>Přihlášení</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="login-username">Uživatelské jméno</label>
        <input type="text" id="login-username" name="username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="login-password">Heslo</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" required>
      </div>
      <p id="login-error" class="admin-error" hidden></p>
      <button type="submit" class="btn btn-primary">Přihlásit se</button>
    </form>
  </section>

  <!-- Dashboard -->
  <section id="dashboard-view" hidden>

    <nav class="admin-tabs" role="tablist">
      <button type="button" class="admin-tab is-active" data-tab="terminy" role="tab" aria-selected="true">Termíny</button>
      <button type="button" class="admin-tab" data-tab="vypsat" role="tab" aria-selected="false">Nový termín</button>
      <button type="button" class="admin-tab" data-tab="prihlaseni" role="tab" aria-selected="false">Účastníci</button>
    </nav>

    <div class="admin-tab-panel" data-tab-panel="terminy">

      <div class="admin-card">
        <div class="admin-card-head">
          <h2>Termíny kurzu</h2>
        </div>
        <div id="slots-list" class="slots-list"></div>
      </div>

    </div>

    <div class="admin-tab-panel" data-tab-panel="vypsat" hidden>

      <div class="admin-card">
        <div class="admin-card-head">
          <h2>Přidat nový termín</h2>
        </div>
        <form id="add-slot-form" class="admin-form-grid">
          <div class="form-group">
            <label for="new-start">Od</label>
            <input type="date" id="new-start" name="start_date" required>
          </div>
          <div class="form-group">
            <label for="new-end">Do (volitelně)</label>
            <input type="date" id="new-end" name="end_date">
          </div>
          <div class="form-group">
            <label for="new-time">Čas</label>
            <input type="text" id="new-time" name="time_label" placeholder="9:00–17:00">
          </div>
          <div class="form-group">
            <label for="new-capacity">Kapacita (počet osob)</label>
            <input type="number" id="new-capacity" name="capacity" min="1" value="10" required>
          </div>
          <div class="form-group form-group-wide">
            <label for="new-address">Adresa</label>
            <input type="text" id="new-address" name="address" placeholder="RC Kaštánek, ZŠ Šeříková 682/33, Ostrava">
          </div>
          <div class="form-group form-group-wide">
            <label for="new-note">Poznámka (volitelně)</label>
            <input type="text" id="new-note" name="note" placeholder="interní poznámka">
          </div>
          <button type="submit" class="btn btn-primary">Přidat termín</button>
        </form>
        <p id="add-slot-error" class="admin-error" hidden></p>
      </div>

    </div>

    <div class="admin-tab-panel" data-tab-panel="prihlaseni" hidden>

      <div class="admin-card">
        <div class="admin-card-head">
          <h2>Přihlášení účastníci</h2>
        </div>
        <div class="form-group">
          <label for="registrations-search">Hledat podle jména nebo e-mailu</label>
          <input type="text" id="registrations-search" placeholder="Jana Nováková…">
        </div>
        <div id="registrations-list"></div>
      </div>

    </div>

  </section>

</main>

<script src="/admin/admin.js"></script>
</body>
</html>
